name: Update distro links

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-distro-links.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate DISTRO-LINKS.md from README.md
        shell: python
        run: |
          import re
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          lines = readme.splitlines()

          # Automatically discover every level-2 README section. Any section
          # containing Markdown distro links becomes a section in the index.
          sections = []
          current = None

          for line in lines:
              heading = re.match(r"^##\s+(.+?)\s*$", line)
              if heading:
                  title = heading.group(1).strip()
                  title_plain = re.sub(r"^[^A-Za-z0-9]+", "", title).strip()
                  current = {"title": title, "plain": title_plain, "items": []}
                  sections.append(current)
                  continue

              if current:
                  match = re.match(r"^- \[([^\]]+)\]\((https?://[^)]+)\)\s+—\s+(.+)$", line)
                  if match:
                      name, url, description = match.groups()
                      current["items"].append((name, url, description))

          # Keep only sections that actually contain distro-style links.
          sections = [section for section in sections if section["items"]]

          out = [
              "# Linux & Unix Distro Links 🐧",
              "",
              "A central list of official websites for the operating systems documented in `README.md`.",
              "",
              "> This file is automatically generated from the distro lists in `README.md`. Do not edit it manually.",
              "",
          ]

          for section in sections:
              out += [
                  section["title"],
                  "",
                  "| Distribution | Official Website | Description |",
                  "|---|---|---|",
              ]

              for name, url, description in section["items"]:
                  # Escape table-breaking characters while preserving Markdown links.
                  safe_name = name.replace("|", "\\|")
                  safe_description = description.replace("|", "\\|")
                  out.append(f"| [{safe_name}]({url}) | {url} | {safe_description} |")

              out.append("")

          out += [
              "## 🔄 Automatic Updates",
              "",
              "This file is regenerated automatically whenever `README.md` changes on `main`.",
              "Any new `##` section containing distro-style links is discovered automatically, so new categories added later do not require changes to this workflow.",
              "",
              "## 📜 Disclaimer",
              "",
              "This is an unofficial index. Always use the official project website for the newest releases, checksums, signatures, and installation instructions.",
              "",
          ]

          Path("DISTRO-LINKS.md").write_text("\n".join(out), encoding="utf-8")

      - name: Commit updated links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DISTRO-LINKS.md
          git diff --cached --quiet || git commit -m "Automatically update distro links"
          git push
