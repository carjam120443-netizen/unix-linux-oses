name: Update distro links

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-distro-links.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate DISTRO-LINKS.md from README.md
        shell: python
        run: |
          import re
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          lines = readme.splitlines()

          sections = {
              "Popular Linux Distributions": [],
              "Lightweight Linux Distributions": [],
          }

          current = None
          for line in lines:
              heading = re.match(r"^##\s+(.+?)\s*$", line)
              if heading:
                  title = re.sub(r"^[^A-Za-z]+", "", heading.group(1)).strip()
                  current = title if title in sections else None
                  continue

              if current:
                  match = re.match(r"^- \[([^\]]+)\]\((https?://[^)]+)\)\s+—\s+(.+)$", line)
                  if match:
                      name, url, description = match.groups()
                      sections[current].append((name, url, description))

          out = [
              "# Linux & Unix Distro Links 🐧",
              "",
              "A central list of official websites for the distributions documented in `README.md`.",
              "",
              "> This file is automatically generated from the distro lists in `README.md`. Do not edit it manually.",
              "",
              "## 🌐 Popular Linux Distributions",
              "",
              "| Distribution | Official Website | Description |",
              "|---|---|---|",
          ]

          for name, url, description in sections["Popular Linux Distributions"]:
              out.append(f"| [{name}]({url}) | {url} | {description} |")

          out += [
              "",
              "## 🪶 Lightweight Linux Distributions",
              "",
              "| Distribution | Official Website | Description |",
              "|---|---|---|",
          ]

          for name, url, description in sections["Lightweight Linux Distributions"]:
              out.append(f"| [{name}]({url}) | {url} | {description} |")

          out += [
              "",
              "## 🔄 Automatic Updates",
              "",
              "This file is regenerated automatically whenever `README.md` changes on `main`.",
              "",
              "## 📜 Disclaimer",
              "",
              "This is an unofficial index. Always use the official project website for the newest releases, checksums, signatures, and installation instructions.",
              "",
          ]

          Path("DISTRO-LINKS.md").write_text("\n".join(out), encoding="utf-8")

      - name: Commit updated links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DISTRO-LINKS.md
          git diff --cached --quiet || git commit -m "Automatically update distro links"
          git push
